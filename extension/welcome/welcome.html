<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Portal Customizer</title>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <main>
    <header><img src="../icons/icon48.png" alt=""><h1 id="title"></h1></header>
    <section class="warn">
      <h2 data-i18n="welcomeWarnHead"></h2>
      <p data-i18n="welcomeWarnBody"></p>
      <div class="mock" aria-hidden="true">
        <div class="mock-box">
          <span class="mock-x" title="X">✕</span>
          <b data-i18n="welcomeMockTitle"></b>
          <p data-i18n="welcomeMockBody"></p>
          <span class="mock-off" data-i18n="welcomeMockOff"></span>
        </div>
        <div class="mock-tag do"><span>✓</span> <span data-i18n="welcomeDo"></span></div>
        <div class="mock-tag dont"><span>✕</span> <span data-i18n="welcomeDont"></span></div>
      </div>
    </section>
    <section>
      <h2 data-i18n="welcomeReHead"></h2>
      <ol><li data-i18n="welcomeRe1"></li><li data-i18n="welcomeRe2"></li><li data-i18n="welcomeRe3"></li></ol>
    </section>
    <section id="adminSec" hidden>
      <h2 data-i18n="welcomeAdminHead"></h2>
      <p id="notice" class="notice"></p>
    </section>
    <footer><span id="pcId"></span><button id="closeBtn" data-i18n="welcomeClose"></button></footer>
  </main>
  <script src="welcome.js"></script>
</body>
</html>
