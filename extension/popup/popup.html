<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="24" height="24">
    <h1 data-i18n="extName">Portal Customizer</h1>
    <span id="version" class="muted"></span>
  </header>

  <section class="toggles">
    <label class="switch"><span data-i18n="enable">Enable</span><input type="checkbox" id="enabled"><i></i></label>
    <label class="switch" id="editModeRow"><span data-i18n="editMode">Edit mode</span><input type="checkbox" id="editMode"><i></i></label>
    <p class="hint" id="editHint" data-i18n="editHint"></p>
  </section>

  <section id="pageSec">
    <h2 data-i18n="thisPage">This page</h2>
    <p id="pageAddr" class="status"></p>
    <div class="row">
      <button id="pageOn" data-i18n="pageCustomize">Customize this page</button>
      <button id="pageOff" class="link" data-i18n="pageStop" hidden>Stop customizing this page</button>
    </div>
    <p id="pageStatus" class="status"></p>
  </section>

  <section>
    <h2 data-i18n="layoutSource">Layout</h2>
    <p id="source" class="status"></p>
    <div id="orgPending" class="notice" hidden>
      <span id="orgPendingText"></span>
      <button id="applyOrg" data-i18n="applyOrg">Apply</button>
    </div>
    <div class="row export-row">
      <button id="exportLayout" data-i18n="exportJson">Export as JSON</button>
      <span id="exportStatus" class="status"></span>
    </div>
    <p class="hint" data-i18n="exportHint"></p>
    <button id="resetMine" class="link" data-i18n="resetMine" hidden>Discard my layout</button>
  </section>

  <section>
    <h2 data-i18n="orgDefault">Organization default</h2>
    <div class="row">
      <input type="url" id="orgUrl" data-i18n-placeholder="orgUrlPlaceholder" spellcheck="false">
      <button id="saveOrg" data-i18n="loadOrg">Load</button>
    </div>
    <p id="orgStatus" class="status"></p>
    <div class="row interval">
      <label for="orgMinutes" data-i18n="orgInterval">Check every</label>
      <input type="number" id="orgMinutes" min="1" max="1440" step="1">
      <span data-i18n="minutes">min</span>
      <span id="orgMinutesNote" class="status"></span>
    </div>
  </section>

  <section id="adminSec">
    <div class="row admin-head"><h2 data-i18n="adminTitle">Administrator</h2><a href="#" id="adminToggle" class="small-link" data-i18n="adminLogin">Admin login</a></div>
    <div id="adminLoginBox" hidden>
      <p id="adminServerAuto" class="status" hidden><span id="adminServerHost"></span> · <a href="#" id="adminServerChange" data-i18n="adminServerChange">Change</a></p>
      <input type="url" id="adminServer" data-i18n-placeholder="adminServerPlaceholder" spellcheck="false">
      <div class="row"><input type="text" id="adminUser" data-i18n-placeholder="adminUserPlaceholder" autocomplete="username"><input type="password" id="adminPass" data-i18n-placeholder="adminPassPlaceholder" autocomplete="current-password"></div>
      <label class="check-row"><input type="checkbox" id="adminRemember"> <span data-i18n="adminRemember">Save login</span></label>
      <button id="adminLoginBtn" data-i18n="adminLoginBtn">Log in</button>
      <p id="adminLoginStatus" class="status"></p>
    </div>
    <div id="adminBox" hidden>
      <p id="adminWho" class="status"></p>
      <div class="row"><input type="text" id="sendName" data-i18n-placeholder="sendNamePlaceholder"><button id="sendBtn" data-i18n="sendToServer">Send</button></div>
      <p id="sendStatus" class="status"></p>
      <div class="row admin-links"><a href="#" id="openConsole" data-i18n="openConsole">Open admin page</a> · <a href="#" id="useServerOrg" data-i18n="useServerOrg">Use as organization default</a> · <a href="#" id="adminLogout" data-i18n="adminLogout">Log out</a></div>
    </div>
  </section>

  <section class="update">
    <div id="update" class="update-row"><span id="updateText"></span><button id="updateBtn" data-i18n="updateNow">Update now</button></div>
    <div class="row interval">
      <label for="updateSource" data-i18n="updateFrom">Updates from</label>
      <select id="updateSource">
        <option value="" data-i18n="updateFromAuto">Automatic</option>
        <option value="server" data-i18n="updateFromServer">Admin server</option>
        <option value="github" data-i18n="updateFromGithub">Internet (GitHub releases)</option>
      </select>
      <span id="updateSourceNote" class="status"></span>
    </div>
    <p class="status"><a href="#" id="checkNow" data-i18n="checkUpdates">Check for updates</a></p>
  </section>
  <script src="../lib/version.js"></script>
  <script src="../lib/layout.js"></script>
  <script src="popup.js"></script>
</body>
</html>
